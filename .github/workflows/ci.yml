name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    name: Node ${{ matrix.node }} / plugin ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        plugin: ["1.17.11", latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Override plugin dependency for compatibility test
        run: |
          npm install --no-save --package-lock=false "@opencode-ai/plugin@${{ matrix.plugin }}"
          git diff --exit-code -- package.json package-lock.json

      - name: Run tests
        run: npm test

      - name: Check package import
        run: npm run check:import

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Audit production dependencies
        run: npm audit --omit=dev
